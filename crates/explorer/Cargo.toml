[package]
name = "repo-city"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "repo-city"
path = "../game/src/repo_city/main.rs"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["std", "default_app", "3d_bevy_render", "ui_bevy_render", "bevy_ui_widgets", "bevy_winit", "scene", "picking", "png", "keyboard", "mouse"] }
repo-world = { path = "../repository" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.10"
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSURL", "NSGeometry", "objc2-core-foundation"] }
security-framework = "3.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
notify = { version = "7", default-features = false, features = ["macos_fsevent"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
ureq = { version = "2.12", features = ["json"] }
bevy = { version = "0.20", default-features = true, features = ["system_clipboard"] }
avian3d = { version = "0.8", default-features = false, features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
bevy = { version = "0.20", default-features = false, features = ["webgpu"] }
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }
