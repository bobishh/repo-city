<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo City</title>
  <link rel="icon" type="image/svg+xml" href="./assets/robot-head.svg">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main aria-label="3D repository city">
    <canvas id="repo-city" tabindex="0" hidden></canvas>
    <div id="start-screen" aria-hidden="true">
      <img src="./assets/start-screen.webp" alt="" fetchpriority="high">
    </div>
    <h1><button id="logo" type="button" aria-label="Repo City" aria-haspopup="dialog" aria-controls="repository-dialog" title="Open repository">
      <img class="android" src="./assets/robot-head.svg" alt="">
      <span class="wordmark">Repo City</span>
    </button></h1>
    <button id="help" type="button" aria-label="How to use Repo City" aria-haspopup="dialog" aria-controls="review-dialog" title="How to use Repo City" hidden>H</button>
    <aside id="progress-warning" hidden>
      <span role="status"></span>
      <button type="button" aria-label="Dismiss progress warning">×</button>
    </aside>
    <a id="blame" target="_blank" rel="noopener noreferrer" aria-label="Blame on GitHub" hidden>Blame<span> on GitHub</span></a>
    <div id="start-controls">
      <form id="repository-form" aria-label="Open repository">
        <div id="repository-search">
          <div class="picker-row picker-search">
            <label>
              <span class="visually-hidden">GitHub repository or pull request</span>
              <input id="repository-query" name="repo" placeholder="Find a repository or paste a PR URL" autocomplete="off" spellcheck="false">
            </label>
            <button id="select-repository" class="picker-icon" type="button" aria-label="Select repository">→</button>
          </div>
          <div id="repository-results"></div>
        </div>
        <div id="repository-selection" hidden>
          <div class="picker-row picker-selection">
            <span id="selected-repository"></span>
            <button id="change-repository" class="picker-icon" type="button" aria-label="Change repository">×</button>
          </div>
          <div class="picker-toolbar">
            <div id="revisions">
              <button id="choose-revision" type="button">Default branch</button>
              <button id="choose-base" type="button">Compare…</button>
              <button id="choose-pull" type="button" aria-controls="pull-editor" aria-expanded="false">Pull requests</button>
            </div>
            <button id="open-city" type="submit">Open city</button>
          </div>
          <div id="revision-editor" hidden>
            <div class="picker-row picker-search">
              <label>
                <span class="visually-hidden">Find a branch, tag, or commit</span>
                <input id="revision-search" placeholder="Find a branch, tag, or commit" autocomplete="off" spellcheck="false">
              </label>
              <button id="use-revision" class="picker-icon" type="button" aria-label="Use revision">↵</button>
            </div>
            <div id="revision-results"></div>
          </div>
          <div id="pull-editor" hidden>
            <div class="picker-row picker-search">
              <label><span class="visually-hidden">Find an open pull request</span>
                <input id="pull-search" placeholder="Find a pull request by number or title" autocomplete="off" spellcheck="false">
              </label>
            </div>
            <div id="pull-results"></div>
          </div>
        </div>
        <input type="hidden" name="ref">
        <input type="hidden" name="base">
        <button id="close" class="picker-icon" type="button" aria-label="Close repository picker" hidden>×</button>
        <p id="status" role="status"></p>
        <div id="picker-footer">
          <nav id="picker-links" aria-label="Repo City source">
            <a href="https://github.com/bobishh/repo-city" target="_blank" rel="noopener">Source on GitHub</a>
          </nav>
          <details id="comparison-progress" hidden>
            <summary>Progress</summary>
            <div class="picker-menu">
              <small id="progress-summary"></small>
              <button id="reset-progress" type="button">Reset progress</button>
            </div>
          </details>
          <button id="github-login" type="button" hidden>Sign in with GitHub</button>
          <details id="github-account" hidden>
            <summary id="github-user"></summary>
            <div class="picker-menu">
              <a id="github-install" hidden>Choose private repositories</a>
              <button id="github-logout" type="button">Sign out</button>
            </div>
          </details>
        </div>
      </form>
    </div>
    <dialog id="repository-dialog" aria-label="Open repository"></dialog>
    <dialog id="review-dialog" class="city-dialog" aria-labelledby="review-title"></dialog>
  </main>
</body>
</html>
