<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo City</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main aria-label="3D repository city">
    <canvas id="repo-city" tabindex="0" hidden></canvas>
    <div id="start-screen" aria-hidden="true">
      <img src="./assets/start-screen.webp" alt="" fetchpriority="high">
    </div>
    <h1><button id="logo" type="button" aria-label="Repo City" aria-haspopup="dialog" aria-controls="repository-dialog" title="Open repository">
      <span class="android" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M13 45v-6l-5-4V17l5-6h21l6 6v20l-6 4H16" fill="#b09878" stroke="#2a1d33" stroke-width="2"/>
          <path d="M13 12 9 3m6 33h19M12 21h25v11H12z" fill="#171221" stroke="#171221" stroke-width="2"/>
          <path d="M16 25h7v3h-7zM28 26h6v2h-6zM7 2h4v4H7z" fill="#ffdf85"/>
          <path d="M7 22h5v10H7z" fill="#70e9d6"/>
        </svg>
      </span>
      <span class="wordmark">Repo City</span>
    </button></h1>
    <a id="blame" target="_blank" rel="noopener noreferrer" aria-label="Blame on GitHub" hidden>Blame<span> on GitHub</span></a>
    <div id="start-controls">
      <form id="repository-form" aria-labelledby="repository-title">
        <div class="form-title">
          <h2 id="repository-title">Open repository</h2>
          <button id="close" type="button" aria-label="Close repository picker" hidden>×</button>
        </div>
        <label>Public GitHub repository or pull request
          <input name="repo" placeholder="owner/repository or PR URL" autocomplete="off" spellcheck="false" required>
        </label>
        <div id="revisions">
          <label>Branch, tag, or commit
            <input name="ref" placeholder="Default branch" autocomplete="off" spellcheck="false">
          </label>
          <label>Compare with
            <input name="base" placeholder="Parent commit" autocomplete="off" spellcheck="false">
          </label>
        </div>
        <div class="form-action">
          <p id="status" role="status"></p>
          <button type="submit">Open city</button>
        </div>
      </form>
    </div>
    <dialog id="repository-dialog" aria-label="Open repository"></dialog>
  </main>
</body>
</html>
