<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repo City</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <aside>
      <h1>Repo City</h1>
      <button id="change" type="button">Repository</button>
      <a id="blame" target="_blank" rel="noopener noreferrer" aria-label="Blame on GitHub" hidden>Blame<span> on GitHub</span></a>
      <form>
        <label>Public GitHub repository or pull request <input name="repo" placeholder="owner/repository or PR URL" required></label>
        <label>Revision <input name="ref" placeholder="Default branch"></label>
        <label>Compare with <input name="base" placeholder="Parent commit"></label>
        <button type="submit">Open city</button>
      </form>
      <p id="status" role="status"></p>
    </aside>
    <section aria-label="3D repository city">
      <canvas id="repo-city" tabindex="0" hidden></canvas>
      <div id="start-screen" aria-hidden="true">
        <img src="./assets/start-screen.webp" alt="" fetchpriority="high">
        <span class="start-title">Repo City</span>
      </div>
    </section>
  </main>
</body>
</html>
