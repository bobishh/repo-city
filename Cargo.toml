[workspace]
resolver = "3"
members = ["crates/repository", "crates/explorer"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[patch.crates-io]
webrtc-ice = { path = "crates/explorer/vendor/webrtc-ice" }
