name: Publish desktop packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Desktop preview release tag
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev libudev-dev libfontconfig-dev libwayland-dev libxkbcommon-dev libx11-dev libxkbcommon-x11-0
          VIBE_CITY_BUILD_PROFILE=dev ./scripts/build-linux.sh
          tar -tzf dist/VibeCity-*.tar.gz >/dev/null
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -BuildProfile dev
          tar -tf dist/VibeCity-x86_64-pc-windows-msvc.zip | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Invalid Windows archive" }
      - if: runner.os == 'macOS'
        run: |
          ./scripts/build-macos.sh --locked
          codesign --force --sign - 'dist/Vibe City.app'
          codesign --verify --strict 'dist/Vibe City.app'
          ditto -c -k --keepParent 'dist/Vibe City.app' "dist/VibeCity-$(uname -m)-apple-darwin.zip"
          unzip -tq dist/VibeCity-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/VibeCity-*.tar.gz
            dist/VibeCity-*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      - name: Publish the verified packages
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^desktop-preview-[0-9]{4}-[0-9]{2}-[0-9]{2}([-a-z0-9]*)$ ]]
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum VibeCity-* > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --generate-notes VibeCity-* SHA256SUMS
