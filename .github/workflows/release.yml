name: Publish web build

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Run containing the verified browser-build artifact
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: production
      url: https://repo-city.meta-uber-engineer.dev
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-build
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          path: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check the Worker module in the deployment artifact
        working-directory: release
        run: |
          node --input-type=module -e 'const { default: worker } = await import("./worker.mjs"); if (typeof worker.fetch !== "function") process.exit(1);'
      - name: Deploy the tested build
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLIENT_ID: ${{ secrets.REPO_CITY_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.REPO_CITY_GITHUB_CLIENT_SECRET }}
          GITHUB_APP_SLUG: ${{ secrets.REPO_CITY_GITHUB_APP_SLUG }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN in the production environment."
            exit 1
          fi
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          auth_args=()
          if [ -n "$GITHUB_CLIENT_ID" ] && [ -n "$GITHUB_CLIENT_SECRET" ]; then
            secret_file=$(mktemp "$RUNNER_TEMP/github-app.XXXXXX")
            trap 'rm -f "$secret_file"' EXIT
            python3 - "$secret_file" <<'PYCODE'
          import json
          import os
          import sys
          with open(sys.argv[1], "w") as output:
              json.dump({key: os.environ[key] for key in (
                  "GITHUB_CLIENT_ID", "GITHUB_CLIENT_SECRET", "GITHUB_APP_SLUG",
              )}, output)
          PYCODE
            auth_args=(--secrets-file "$secret_file")
          fi
          npx --yes wrangler@4.162.0 versions upload --config wrangler.jsonc --message "$GITHUB_SHA" "${auth_args[@]}"
          version_id=$(jq -er 'select(.type == "version-upload") | .version_id | strings' "$WRANGLER_OUTPUT_FILE_PATH")
          npx --yes wrangler@4.162.0 versions deploy "$version_id@100%" --config wrangler.jsonc --yes
      - name: Verify the live assets match the tested build
        working-directory: release
        run: |
          base=https://repo-city.meta-uber-engineer.dev
          wasm=dist/game/repo_city_bg.wasm
          if [ -f "$wasm.gz" ]; then
            gzip -dc "$wasm.gz" > "$RUNNER_TEMP/expected.wasm"
            wasm="$RUNNER_TEMP/expected.wasm"
          fi
          check_live() {
            local route=$1 expected=$2
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --compressed --max-time 20 \
                  "$base$route?release=$GITHUB_SHA" -o "$RUNNER_TEMP/live-asset" &&
                  cmp -s "$expected" "$RUNNER_TEMP/live-asset"; then
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then sleep 5; fi
            done
            echo "::error::Live asset $route does not match $GITHUB_SHA"
            return 1
          }
          check_live / dist/index.html
          check_live /style.css dist/style.css
          check_live /app.mjs dist/app.mjs
          check_live /github-picker.mjs dist/github-picker.mjs
          check_live /pointer.mjs dist/pointer.mjs
          check_live /progress.mjs dist/progress.mjs
          check_live /assets/robot-head.svg dist/assets/robot-head.svg
          check_live /assets/apple-touch-icon.png dist/assets/apple-touch-icon.png
          check_live /game/repo_city_bg.wasm "$wasm"
          curl --fail --silent --show-error --max-time 20 "$base/github/session" |
            jq -e '.enabled | type == "boolean"'
