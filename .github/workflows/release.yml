name: Publish web build

on:
  workflow_dispatch:
    inputs:
      use_published_image:
        description: Reuse the verified GHCR image for this commit
        type: boolean
        default: false
      preflight:
        description: Verify on the VPS before the production DNS switch
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: repo-city-web-production
  cancel-in-progress: false

jobs:
  package:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.use_published_image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          cache-bin: true
      - run: npm ci
        working-directory: web
      - name: Build browser assets
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
          if [[ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $version" ]]; then
            cargo install --locked --version "$version" wasm-bindgen-cli
          fi
          ./scripts/build-web.sh
      - name: Package and verify the Phoenix release
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repo-city:$GITHUB_SHA"
          docker build --file server/Dockerfile --build-arg "REPO_CITY_REVISION=$GITHUB_SHA" -t "$image" .
          test "$(docker image inspect --format '{{ index .Config.Labels "service" }}' "$image")" = repo-city
          container=$(docker run --rm --detach --publish 127.0.0.1::8080 \
            --env GITHUB_CLIENT_ID=verify --env GITHUB_CLIENT_SECRET=verify \
            --env REVIEW_PARTIES_ENABLED=true "$image")
          trap 'docker stop "$container" >/dev/null' EXIT
          endpoint="http://$(docker port "$container" 8080/tcp)"
          curl --fail --silent --retry 5 --retry-all-errors "$endpoint/up"
          node scripts/verify-web.mjs "$endpoint" "$GITHUB_SHA" true
      - name: Publish the commit image to GHCR
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repo-city:$GITHUB_SHA"
          printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker push "$image"

  deploy:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.package.result == 'success' || inputs.use_published_image) }}
    needs: package
    name: Deploy to Hetzner through Kamal
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://repo-city.meta-uber-engineer.dev
    env:
      SERVER_IP: ${{ vars.DEPLOY_SERVER_IP }}
      DOCKER_REGISTRY_USERNAME: ${{ github.repository_owner }}
      DOCKER_REGISTRY_PASSWORD: ${{ github.token }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      REPO_CITY_GITHUB_CLIENT_ID: ${{ secrets.REPO_CITY_GITHUB_CLIENT_ID }}
      REPO_CITY_GITHUB_CLIENT_SECRET: ${{ secrets.REPO_CITY_GITHUB_CLIENT_SECRET }}
      REPO_CITY_GITHUB_APP_SLUG: ${{ secrets.REPO_CITY_GITHUB_APP_SLUG }}
      REVIEW_PARTIES_ENABLED: ${{ vars.REVIEW_PARTIES_ENABLED || 'false' }}
      REVIEW_PARTY_ICE_SERVERS: ${{ secrets.REVIEW_PARTY_ICE_SERVERS }}
      REVIEW_PARTY_TURN_SECRET: ${{ secrets.REVIEW_PARTY_TURN_SECRET }}
      REPO_CITY_TLS_CERTIFICATE: ${{ secrets.REPO_CITY_TLS_CERTIFICATE }}
      REPO_CITY_TLS_PRIVATE_KEY: ${{ secrets.REPO_CITY_TLS_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4.7'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Prepare the shared VPS connection
        run: |
          for name in SERVER_IP DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS REPO_CITY_GITHUB_CLIENT_ID REPO_CITY_GITHUB_CLIENT_SECRET; do
            test -n "${!name}" || { echo "Missing production setting: $name"; exit 1; }
          done
          gem install kamal -v 2.10.1 --no-document
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/repo-city-deploy.key"
          eval "$(ssh-agent -s)"
          ssh-add "$RUNNER_TEMP/repo-city-deploy.key"
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$SERVER_IP" true
      - name: Ensure the authenticated TURN relay is running
        if: ${{ env.REVIEW_PARTY_TURN_SECRET != '' }}
        run: |
          relay=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$SERVER_IP" \
            "docker ps --all --filter 'name=^repo-city-turn$' --format '{{.State}}'")
          case "$relay" in
            running) ;;
            "") kamal accessory boot turn ;;
            *) kamal accessory start turn ;;
          esac
      - name: Deploy and verify the immutable image on the VPS
        run: |
          kamal deploy --skip-push --skip-hooks --version "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repo-city:$GITHUB_SHA"
          container=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$SERVER_IP" \
            "docker ps --filter label=service=repo-city --filter ancestor=$image --format '{{.ID}}'")
          [[ "$container" =~ ^[a-f0-9]+$ ]]
          container_ip=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$SERVER_IP" \
            "docker inspect --format '{{ (index .NetworkSettings.Networks \"kamal\").IPAddress }}' $container")
          [[ "$container_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          headers=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$SERVER_IP" \
            "curl --fail --silent --show-error --max-time 10 --head http://$container_ip:8080/up")
          grep -Fqi "x-repo-city-revision: $GITHUB_SHA" <<< "$headers"
      - name: Verify production after the DNS switch
        if: ${{ !inputs.preflight }}
        run: node scripts/verify-web.mjs https://repo-city.meta-uber-engineer.dev "$GITHUB_SHA" "$REVIEW_PARTIES_ENABLED"
